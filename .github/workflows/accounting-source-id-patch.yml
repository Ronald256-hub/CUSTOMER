name: Apply accounting source ID query update

on:
  push:
    branches:
      - agent/advanced-procurement-inventory

permissions:
  contents: write

jobs:
  apply-source-id:
    if: ${{ !contains(github.event.head_commit.message, '[accounting-source-id]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/advanced-procurement-inventory
          fetch-depth: 0

      - name: Add source ID to journal listing query
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Robo.Pos.Server/Accounting/AccountingJournalService.cs')
          text = path.read_text(encoding='utf-8')
          old_select = '''            journal.description,
                      journal.source_type,
                      journal.status,
                      journal.total_debit_minor,
                      journal.total_credit_minor,
                      journal.version,
                      journal.updated_at_utc'''
          new_select = '''            journal.description,
                      journal.source_type,
                      journal.source_id,
                      journal.status,
                      journal.total_debit_minor,
                      journal.total_credit_minor,
                      journal.version,
                      journal.updated_at_utc'''
          if text.count(old_select) != 1:
              raise SystemExit(f'journal select: expected one match, found {text.count(old_select)}')
          text = text.replace(old_select, new_select)

          old_map = '''                reader.GetString(5),
                          reader.GetString(6),
                          reader.GetString(7),
                          reader.GetInt64(8),
                          reader.GetInt64(9),
                          reader.GetInt32(10),
                          ParseDateTime(reader.GetString(11))));'''
          new_map = '''                reader.GetString(5),
                          reader.GetString(6),
                          reader.IsDBNull(7) ? null : reader.GetString(7),
                          reader.GetString(8),
                          reader.GetInt64(9),
                          reader.GetInt64(10),
                          reader.GetInt32(11),
                          ParseDateTime(reader.GetString(12))));'''
          if text.count(old_map) != 1:
              raise SystemExit(f'journal mapping: expected one match, found {text.count(old_map)}')
          path.write_text(text.replace(old_map, new_map), encoding='utf-8')
          Path('.github/workflows/accounting-source-id-patch.yml').unlink()
          PY

      - name: Commit accounting source ID support
        shell: bash
        run: |
          git config user.name "Nexus Accounting Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose journal source IDs for reconciliation [accounting-source-id]"
          git push origin HEAD:agent/advanced-procurement-inventory
