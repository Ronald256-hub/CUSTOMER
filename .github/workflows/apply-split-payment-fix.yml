name: Apply focused split payment corrections

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-partial-payments
          fetch-depth: 0

      - name: Apply focused corrections
        shell: pwsh
        run: |
          & 'release-engineering/FIX_SPLIT_PAYMENT_COMPILE.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary correction machinery
        shell: pwsh
        run: |
          Remove-Item 'release-engineering/FIX_SPLIT_PAYMENT_COMPILE.ps1' -Force
          Remove-Item '.github/workflows/apply-split-payment-fix.yml' -Force

      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix split payment receipt compilation'
          git push origin HEAD:agent/split-partial-payments
