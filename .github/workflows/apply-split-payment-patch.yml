name: Apply Nexus POS 7.0 split payment patch

on:
  push:
    branches:
      - agent/split-partial-payments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-partial-payments
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply controlled source patches
        run: |
          python release-engineering/PATCH_SPLIT_PAYMENT_CORE.py
          python release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py

      - name: Remove temporary patch machinery
        run: |
          rm release-engineering/PATCH_SPLIT_PAYMENT_CORE.py
          rm release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py
          rm .github/workflows/apply-split-payment-patch.yml

      - name: Commit patched release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add split and partial payments'
          git push origin HEAD:agent/split-partial-payments
