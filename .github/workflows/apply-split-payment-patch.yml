name: Apply Nexus POS 7.0 split payment patch

on:
  push:
    branches:
      - agent/split-partial-payments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-partial-payments
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply controlled source patches
        id: patch
        shell: bash
        run: |
          set +e
          python release-engineering/PATCH_SPLIT_PAYMENT_CORE.py > split-payment-patch.log 2>&1
          core_exit=$?
          if [ $core_exit -eq 0 ]; then
            python release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py >> split-payment-patch.log 2>&1
            integration_exit=$?
          else
            integration_exit=99
          fi
          cat split-payment-patch.log
          echo "core_exit=$core_exit" >> "$GITHUB_OUTPUT"
          echo "integration_exit=$integration_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostics when patch fails
        if: steps.patch.outputs.core_exit != '0' || steps.patch.outputs.integration_exit != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add split-payment-patch.log
          git commit -m 'Record split payment patch diagnostics'
          git push origin HEAD:agent/split-partial-payments

      - name: Stop after patch failure
        if: steps.patch.outputs.core_exit != '0' || steps.patch.outputs.integration_exit != '0'
        run: exit 1

      - name: Remove temporary patch machinery
        if: steps.patch.outputs.core_exit == '0' && steps.patch.outputs.integration_exit == '0'
        run: |
          rm release-engineering/PATCH_SPLIT_PAYMENT_CORE.py
          rm release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py
          rm .github/workflows/apply-split-payment-patch.yml
          rm split-payment-patch.log

      - name: Commit patched release
        if: steps.patch.outputs.core_exit == '0' && steps.patch.outputs.integration_exit == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add split and partial payments'
          git push origin HEAD:agent/split-partial-payments
