name: Validate cash drawer and shift reconciliation

on:
  pull_request:
    paths:
      - 'BUILD_WINDOWS_RELEASE.ps1'
      - 'RELEASE_SMOKE_TEST.ps1'
      - 'release-engineering/**'
      - 'src/**'
      - '.github/workflows/cash-drawer-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-cash-drawer:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/split-partial-payments
          fetch-depth: 0

      - name: Apply staged Nexus POS 7.0 patch
        if: hashFiles('release-engineering/PATCH_SPLIT_PAYMENT_CORE.py') != ''
        shell: pwsh
        run: |
          python 'release-engineering/PATCH_SPLIT_PAYMENT_CORE.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python 'release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item 'release-engineering/PATCH_SPLIT_PAYMENT_CORE.py' -Force
          Remove-Item 'release-engineering/PATCH_SPLIT_PAYMENT_INTEGRATION.py' -Force
          Remove-Item '.github/workflows/apply-split-payment-patch.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item 'split-payment-patch.log' -Force -ErrorAction SilentlyContinue
          git checkout origin/main -- '.github/workflows/cash-drawer-gate.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add split and partial payments'
          git push origin HEAD:agent/split-partial-payments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Parse cash drawer release gates
        shell: pwsh
        run: |
          foreach ($path in @(
            'release-engineering/VERIFY_CASH_DRAWER_SOURCE.ps1',
            'release-engineering/VERIFY_CASH_DRAWER_RECONCILIATION.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object {
                "$path`:$($_.Extent.StartLineNumber): $($_.Message)"
              }) -join "`n")
            }
          }

      - name: Install pinned browser driver library
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify cash drawer source and invariants
        shell: pwsh
        run: |
          & 'release-engineering/VERIFY_CASH_DRAWER_SOURCE.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply verified source and build corrections
        shell: pwsh
        run: |
          & 'release-engineering/APPLY_KNOWN_WINDOWS_BUILD_FIXES.ps1' -SourceRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: |
          & '.\BUILD_WINDOWS_RELEASE.ps1' -Configuration Release -SkipInstaller *>&1 |
            Tee-Object -FilePath 'cash-drawer-build.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run live cash drawer reconciliation gate
        id: cash_drawer_gate
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & 'release-engineering/VERIFY_CASH_DRAWER_RECONCILIATION.ps1' *>&1 |
              Tee-Object -FilePath 'cash-drawer-transaction.log'
            $exitCode = 0
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath 'cash-drawer-transaction.log' -Append
            $exitCode = 1
          }

          "CASH_DRAWER_GATE_EXIT_CODE=$exitCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Upload cash drawer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-cash-drawer-diagnostics
          path: |
            cash-drawer-build.log
            cash-drawer-transaction.log
            release/smoke-diagnostics-*/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce cash drawer transaction result
        shell: pwsh
        run: |
          if ($env:CASH_DRAWER_GATE_EXIT_CODE -ne '0') {
            Get-Content 'cash-drawer-transaction.log' -Tail 1400 -ErrorAction SilentlyContinue
            throw "Cash drawer transaction gate failed with exit code $env:CASH_DRAWER_GATE_EXIT_CODE."
          }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release' -Filter 'Nexus_POS_*_Portable.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Portable Nexus POS ZIP was not produced.' }

          $manifest = 'release/SHA256SUMS.txt'
          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw 'SHA256SUMS.txt was not produced.'
          }

          $line = Get-Content $manifest | Where-Object { $_ -like "*$($zip.Name)" } | Select-Object -First 1
          if (-not $line) { throw 'Portable ZIP is missing from SHA256SUMS.txt.' }

          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable ZIP checksum mismatch. Expected $expected, got $actual."
          }
