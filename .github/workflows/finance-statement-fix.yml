name: Apply supplier statement alias fix

on:
  push:
    branches:
      - agent/receivables-payables-cashbook

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[finance-statement-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receivables-payables-cashbook
          fetch-depth: 0

      - name: Correct exact supplier statement projection
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/Robo.Pos.Server/Finance/FinanceReportingService.cs')
          text = path.read_text(encoding='utf-8')
          old = '''                CASE WHEN item.supplier_invoice_number = ''
                     THEN 'Supplier purchase'
                     ELSE 'Supplier invoice ' || item.supplier_invoice_number END,
                0 AS debit_minor,'''
          new = '''                CASE WHEN item.supplier_invoice_number = ''
                     THEN 'Supplier purchase'
                     ELSE 'Supplier invoice ' || item.supplier_invoice_number END AS description,
                0 AS debit_minor,'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one supplier statement projection, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/finance-statement-fix.yml').unlink()

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Nexus Finance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix supplier statement projection [finance-statement-fix]"
          git push origin HEAD:agent/receivables-payables-cashbook
