name: Apply supplier statement alias fix

on:
  push:
    branches:
      - agent/receivables-payables-cashbook

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[finance-statement-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receivables-payables-cashbook
          fetch-depth: 0

      - name: Correct supplier statement projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Robo.Pos.Server/Finance/FinanceReportingService.cs')
          text = path.read_text(encoding='utf-8')
          pattern = r"(ELSE 'Supplier invoice ' \|\| item\.supplier_invoice_number END)(,\s*\n\s*0 AS debit_minor,)"
          updated, count = re.subn(pattern, r"\1 AS description\2", text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one supplier statement projection, found {count}')
          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/finance-statement-fix.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Nexus Finance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix supplier statement projection [finance-statement-fix]"
          git push origin HEAD:agent/receivables-payables-cashbook
