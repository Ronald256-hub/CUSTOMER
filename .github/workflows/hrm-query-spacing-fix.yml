name: Apply HRM query spacing correction

on:
  push:
    branches:
      - agent/hrm-workforce-management

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[hrm-query-spacing]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hrm-workforce-management
          fetch-depth: 0

      - name: Preserve SQL whitespace between query fragments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/Robo.Pos.Server/Hrm/HrmService.cs': [
                  ('command.CommandText = EmployeeSelectSql +\n        """\n        WHERE',
                   'command.CommandText = EmployeeSelectSql + "\\n" +\n        """\n        WHERE')
              ],
              'src/Robo.Pos.Server/Hrm/HrmAttendanceLeaveService.cs': [
                  ('command.CommandText = AttendanceSelectSql +\n        """\n        WHERE',
                   'command.CommandText = AttendanceSelectSql + "\\n" +\n        """\n        WHERE'),
                  ('command.CommandText = LeaveSelectSql +\n        """\n        WHERE',
                   'command.CommandText = LeaveSelectSql + "\\n" +\n        """\n        WHERE')
              ]
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one match, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/hrm-query-spacing-fix.yml').unlink()
          PY

      - name: Commit query correction
        shell: bash
        run: |
          git config user.name "Nexus HRM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve HRM query fragment spacing [hrm-query-spacing]"
          git push origin HEAD:agent/hrm-workforce-management
