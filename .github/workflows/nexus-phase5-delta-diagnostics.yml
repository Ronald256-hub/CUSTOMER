name: Diagnose Nexus POS Phase 5 delta

on:
  pull_request:
    paths:
      - 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip.b64.part*'
      - 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_SHA256.txt'
      - '.github/workflows/nexus-phase5-delta-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-delta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and record diagnostics
        id: delta
        shell: pwsh
        run: |
          $diagnostic = [ordered]@{
            generatedUtc = [DateTimeOffset]::UtcNow.ToString('O')
            valid = $false
            partCount = 0
            decodedBytes = 0
            expectedSha256 = $null
            actualSha256 = $null
            decodeError = $null
          }

          try {
            $parts = @(Get-ChildItem 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip.b64.part*' | Sort-Object Name)
            $diagnostic.partCount = $parts.Count
            if ($parts.Count -eq 0) { throw 'Missing Phase 5 delta parts.' }

            $archive = 'Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip'
            $stream = [System.IO.File]::Create($archive)
            try {
              foreach ($part in $parts) {
                $text = Get-Content -LiteralPath $part.FullName -Raw
                $normalized = $text -replace '[^A-Za-z0-9+/=]', ''
                $bytes = [Convert]::FromBase64String($normalized)
                $stream.Write($bytes, 0, $bytes.Length)
                $diagnostic.decodedBytes += $bytes.Length
              }
            }
            finally {
              $stream.Dispose()
            }

            $expectedLine = Get-Content 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_SHA256.txt' -Raw
            $diagnostic.expectedSha256 = ($expectedLine -split '\s+')[0].Trim().ToLowerInvariant()
            $diagnostic.actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $diagnostic.valid = $diagnostic.actualSha256 -eq $diagnostic.expectedSha256
          }
          catch {
            $diagnostic.decodeError = $_.Exception.ToString()
          }

          $diagnostic | ConvertTo-Json -Depth 5 | Set-Content 'phase5-delta-diagnostic.json' -Encoding UTF8
          Get-Content 'phase5-delta-diagnostic.json'
          "DELTA_VALID=$($diagnostic.valid.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload delta diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-phase5-delta-diagnostic
          path: phase5-delta-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce checksum
        shell: pwsh
        run: |
          if ($env:DELTA_VALID -ne 'true') {
            throw 'Phase 5 delta reconstruction or checksum validation failed. See diagnostic artifact.'
          }
