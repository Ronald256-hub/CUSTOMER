name: Verify Nexus POS Phase 5 source

on:
  pull_request:
    paths:
      - 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip.b64.part*'
      - 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_SHA256.txt'
      - 'release-engineering/**'
      - '.github/workflows/nexus-phase5-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check beautifulsoup4 cryptography pillow pygments

      - name: Reconstruct and verify Phase 5 delta
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip.b64.part*' | Sort-Object Name)
          if ($parts.Count -eq 0) {
            throw 'Missing Phase 5 delta parts.'
          }

          $deltaArchive = 'Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip'
          $stream = [System.IO.File]::Create($deltaArchive)
          try {
            foreach ($part in $parts) {
              $text = Get-Content -LiteralPath $part.FullName -Raw
              $normalized = $text -replace '[^A-Za-z0-9+/=]', ''
              $bytes = [Convert]::FromBase64String($normalized)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          }
          finally {
            $stream.Dispose()
          }

          $expectedLine = Get-Content 'releases/Nexus_POS_4.5.0_Phase5_CI_Delta_SHA256.txt' -Raw
          $expected = ($expectedLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $deltaArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Phase 5 delta checksum mismatch. Expected $expected, got $actual."
          }

      - name: Reconstruct Nexus POS 4.5 source tree
        shell: pwsh
        run: |
          $baseArchive = 'releases/Nexus_POS_4.4.0_Phase4_Hardened_Source.zip'
          if (-not (Test-Path -LiteralPath $baseArchive -PathType Leaf)) {
            throw "Missing Phase 4 base source: $baseArchive"
          }
          Expand-Archive -LiteralPath $baseArchive -DestinationPath extracted -Force
          Expand-Archive -LiteralPath 'Nexus_POS_4.5.0_Phase5_CI_Delta_From_4.4.0.zip' -DestinationPath delta -Force
          $root = Resolve-Path 'extracted/Nexus_POS_4.4.0_Phase4_Hardened'
          $manifest = Get-Content 'delta/DELTA_MANIFEST.json' -Raw | ConvertFrom-Json
          foreach ($relativePath in $manifest.deleted) {
            $target = Join-Path $root $relativePath
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          foreach ($relativePath in $manifest.changed_or_added) {
            $source = Join-Path (Resolve-Path 'delta') $relativePath
            $target = Join-Path $root $relativePath
            $targetDirectory = Split-Path -Parent $target
            New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $target -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $root 'release-engineering') -Force | Out-Null
          Copy-Item 'release-engineering\*' (Join-Path $root 'release-engineering') -Recurse -Force
          "NEXUS_SOURCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply verified Windows corrections
        shell: pwsh
        run: |
          & '${{ env.NEXUS_SOURCE_ROOT }}\release-engineering\APPLY_KNOWN_WINDOWS_BUILD_FIXES.ps1' -SourceRoot '${{ env.NEXUS_SOURCE_ROOT }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run source and invariant validation
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          $tests = @(
            'tools/static_validate.py',
            'tools/phase1_invariant_tests.py',
            'tools/phase2_invariant_tests.py',
            'tools/phase2_ui_tests.py',
            'tools/phase3_invariant_tests.py',
            'tools/phase3_ui_tests.py',
            'tools/phase4_invariant_tests.py',
            'tools/phase4_ui_tests.py',
            'tools/phase5_invariant_tests.py',
            'tools/phase5_ui_tests.py'
          )
          foreach ($test in $tests) {
            python $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Parse all JavaScript
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          Get-ChildItem 'src/Robo.Pos.Server/wwwroot','src/Nexus.License.Service/wwwroot' -Filter '*.js' -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore runtime-specific release packages
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          dotnet restore 'src/Robo.Pos.Server/Robo.Pos.Server.csproj' --runtime win-x64 -p:SelfContained=true -p:PublishReadyToRun=true -p:TargetLatestRuntimePatch=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore 'src/Nexus.Pos.Launcher/Nexus.Pos.Launcher.csproj' --runtime win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:TargetLatestRuntimePatch=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore 'src/Nexus.License.Service/Nexus.License.Service.csproj'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build .NET projects with warnings as errors
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          dotnet build 'src/Robo.Pos.Server/Robo.Pos.Server.csproj' -c Release -r win-x64 --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build 'src/Nexus.Pos.Launcher/Nexus.Pos.Launcher.csproj' -c Release -r win-x64 --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build 'src/Nexus.License.Service/Nexus.License.Service.csproj' -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained Windows runtime
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          dotnet publish 'src/Robo.Pos.Server/Robo.Pos.Server.csproj' -c Release -r win-x64 --self-contained true --no-restore -o 'ci-publish/server' -p:PublishReadyToRun=true -p:TargetLatestRuntimePatch=true -p:TreatWarningsAsErrors=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish 'src/Nexus.Pos.Launcher/Nexus.Pos.Launcher.csproj' -c Release -r win-x64 --self-contained true --no-restore -o 'ci-publish/launcher' -p:PublishSingleFile=true -p:TargetLatestRuntimePatch=true -p:TreatWarningsAsErrors=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run automated release smoke test
        shell: pwsh
        working-directory: ${{ env.NEXUS_SOURCE_ROOT }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'RELEASE_SMOKE_TEST.ps1' -ServerExe 'ci-publish/server/Robo.Pos.Server.exe' -RuntimeRoot 'ci-publish/server'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload reconstructed verified source
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-4.5.0-phase5-verified-source
          path: ${{ env.NEXUS_SOURCE_ROOT }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows pilot runtime
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-4.5.0-windows-pilot-runtime
          path: |
            ${{ env.NEXUS_SOURCE_ROOT }}\ci-publish\server
            ${{ env.NEXUS_SOURCE_ROOT }}\ci-publish\launcher
          if-no-files-found: error
          retention-days: 14
