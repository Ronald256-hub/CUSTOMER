name: Validate operator experience and command centre

on:
  pull_request:
    paths:
      - 'BUILD_WINDOWS_RELEASE.ps1'
      - 'RELEASE_SMOKE_TEST.ps1'
      - 'release-engineering/**'
      - 'src/**'
      - '.github/workflows/operator-experience-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-operator-experience:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Parse operator experience assets and gate
        shell: pwsh
        run: |
          node --check 'src/Robo.Pos.Server/wwwroot/experience.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node --check 'release-engineering/VERIFY_OPERATOR_EXPERIENCE_BROWSER.mjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'release-engineering/VERIFY_OPERATOR_EXPERIENCE.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = $errors | ForEach-Object {
              "VERIFY_OPERATOR_EXPERIENCE.ps1:$($_.Extent.StartLineNumber): $($_.Message)"
            }
            throw ($details -join "`n")
          }

      - name: Install pinned browser driver library
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply verified source and build corrections
        shell: pwsh
        run: |
          & 'release-engineering/APPLY_KNOWN_WINDOWS_BUILD_FIXES.ps1' -SourceRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: |
          & '.\BUILD_WINDOWS_RELEASE.ps1' -Configuration Release -SkipInstaller *>&1 |
            Tee-Object -FilePath 'operator-experience-build.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run API and Microsoft Edge operator gate
        id: operator_gate
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & 'release-engineering/VERIFY_OPERATOR_EXPERIENCE.ps1' *>&1 |
              Tee-Object -FilePath 'operator-experience-gate.log'
            $exitCode = 0
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath 'operator-experience-gate.log' -Append
            $exitCode = 1
          }

          "OPERATOR_EXPERIENCE_GATE_EXIT_CODE=$exitCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Upload operator experience diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-operator-experience-diagnostics
          path: |
            operator-experience-build.log
            operator-experience-gate.log
            release/smoke-diagnostics-*/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce operator experience result
        shell: pwsh
        run: |
          if ($env:OPERATOR_EXPERIENCE_GATE_EXIT_CODE -ne '0') {
            Get-Content 'operator-experience-gate.log' -Tail 1200 -ErrorAction SilentlyContinue
            throw "Operator experience gate failed with exit code $env:OPERATOR_EXPERIENCE_GATE_EXIT_CODE."
          }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release' -Filter 'Nexus_POS_*_Portable.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Portable Nexus POS ZIP was not produced.' }

          $manifest = 'release/SHA256SUMS.txt'
          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw 'SHA256SUMS.txt was not produced.'
          }

          $line = Get-Content $manifest | Where-Object { $_ -like "*$($zip.Name)" } | Select-Object -First 1
          if (-not $line) { throw 'Portable ZIP is missing from SHA256SUMS.txt.' }

          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable ZIP checksum mismatch. Expected $expected, got $actual."
          }
