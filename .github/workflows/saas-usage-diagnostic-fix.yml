name: Apply SaaS usage diagnostic hardening

on:
  push:
    branches:
      - agent/saas-tenant-operations

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[saas-usage-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-tenant-operations
          fetch-depth: 0

      - name: Add actual usage values to failure output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('release-engineering/VERIFY_SAAS_TENANT_OPERATIONS.ps1')
          text = path.read_text(encoding='utf-8')
          old = '        throw "Tenant usage and limit evaluation are incorrect."'
          new = '        throw "Tenant usage and limit evaluation are incorrect. Shops=$($usage.activeShopCount); Users=$($usage.activeUserCount); Violations=$($usage.limitViolationsJson); Full=$($usage | ConvertTo-Json -Depth 10 -Compress)"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one usage assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/saas-usage-diagnostic-fix.yml').unlink()
          PY

      - name: Commit diagnostic hardening
        shell: bash
        run: |
          git config user.name "Nexus SaaS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose SaaS usage assertion values [saas-usage-diagnostic]"
          git push origin HEAD:agent/saas-tenant-operations
