name: Apply tenant-isolated usage expectation

on:
  push:
    branches:
      - agent/saas-tenant-operations

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[saas-usage-isolation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-tenant-operations
          fetch-depth: 0

      - name: Correct isolated tenant usage expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('release-engineering/VERIFY_SAAS_TENANT_OPERATIONS.ps1')
          text = path.read_text(encoding='utf-8')
          old = '$usage.activeShopCount -ne 1 -or $usage.activeUserCount -ne 2 -or'
          new = '$usage.activeShopCount -ne 1 -or $usage.activeUserCount -ne 1 -or'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one usage-count assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/saas-usage-expectation-fix.yml').unlink()
          PY

      - name: Commit isolated usage expectation
        shell: bash
        run: |
          git config user.name "Nexus SaaS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Validate tenant-isolated SaaS usage [saas-usage-isolation]"
          git push origin HEAD:agent/saas-tenant-operations
