name: Validate split and partial payments

on:
  pull_request:
    paths:
      - 'BUILD_WINDOWS_RELEASE.ps1'
      - 'RELEASE_SMOKE_TEST.ps1'
      - 'release-engineering/**'
      - 'src/**'
      - '.github/workflows/split-payments-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-split-payments:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Parse split-payment release gates
        shell: pwsh
        run: |
          foreach ($path in @(
            'release-engineering/VERIFY_SPLIT_PAYMENTS_SOURCE.ps1',
            'release-engineering/VERIFY_SPLIT_PAYMENTS.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object {
                "$path`:$($_.Extent.StartLineNumber): $($_.Message)"
              }) -join "`n")
            }
          }

      - name: Verify split-payment source and invariants
        shell: pwsh
        run: |
          & 'release-engineering/VERIFY_SPLIT_PAYMENTS_SOURCE.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply verified source and build corrections
        shell: pwsh
        run: |
          & 'release-engineering/APPLY_KNOWN_WINDOWS_BUILD_FIXES.ps1' -SourceRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: |
          & '.\BUILD_WINDOWS_RELEASE.ps1' -Configuration Release -SkipInstaller *>&1 |
            Tee-Object -FilePath 'split-payments-build.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run live split-payment gate
        id: split_gate
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & 'release-engineering/VERIFY_SPLIT_PAYMENTS.ps1' *>&1 |
              Tee-Object -FilePath 'split-payments-transaction.log'
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath 'split-payments-transaction.log' -Append
            $exitCode = 1
          }
          "SPLIT_GATE_EXIT_CODE=$exitCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Upload split-payment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-split-payment-diagnostics
          path: |
            split-payments-build.log
            split-payments-transaction.log
            release/smoke-diagnostics-*/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce split-payment result
        shell: pwsh
        run: |
          if ($env:SPLIT_GATE_EXIT_CODE -ne '0') {
            Get-Content 'split-payments-transaction.log' -Tail 1400 -ErrorAction SilentlyContinue
            throw "Split-payment transaction gate failed with exit code $env:SPLIT_GATE_EXIT_CODE."
          }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release' -Filter 'Nexus_POS_*_Portable.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Portable Nexus POS ZIP was not produced.' }

          $manifest = 'release/SHA256SUMS.txt'
          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw 'SHA256SUMS.txt was not produced.'
          }

          $line = Get-Content $manifest | Where-Object { $_ -like "*$($zip.Name)" } | Select-Object -First 1
          if (-not $line) { throw 'Portable ZIP is missing from SHA256SUMS.txt.' }

          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable ZIP checksum mismatch. Expected $expected, got $actual."
          }
